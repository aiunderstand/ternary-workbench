# OpenOCD configuration for the simulated REBEL-6 debug transport
# (docs/rebel6-debug.md, Phase E of the debug plan).
#
# The simulator serves the remote_bitbang protocol:
#   RV32IToREBEL --rebel6 prog.tas --jtag-bitbang-port 3737
#
# No OpenOCD target is declared: the riscv target's 32-bit dmi cannot drive
# the spec's 73-bit dmi DR (dtmcs.version = 7 is the guard), so the DM is
# driven through generic irscan/drscan TCL procs (rebel6-dm.tcl). The same
# procs run unchanged over "adapter driver jlink" against hardware (Phase F).

adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 3737
transport select jtag
adapter speed 10000

# IR length 5; IDCODE is the spec's provisional "REB"+01 identifier. OpenOCD
# verifies the id against the TAP at init - reading it IS the first check.
jtag newtap rebel6 cpu -irlen 5 -expected-id 0x52454201

source [file join [file dirname [info script]] rebel6-dm.tcl]

init
